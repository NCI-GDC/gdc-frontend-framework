# yaml-language-server: $schema=https://gitlab.com/gitlab-org/gitlab/-/raw/master/app/assets/javascripts/editor/schema/ci.json
---
include:
  - project: nci-gdc/gitlab-templates
    ref: 0.7.8
    file:
      - templates/global/full.yaml
  - project: nci-gdc/gitlab-templates
    ref: master
    file:
      - templates/deployments/salt-service.yaml

pre-commit:
  except:
    - tags

stages:
  - .pre
  - test
  - unit
  - release
  - "tag image"
  - build_ui_tests_image
  - deploy
  - trigger_ui_tests


variables:
  DEPLOY_SERVICE_TAG: ${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}
  NODEJS_BASE_CONTAINER_VERSION: 4.4.0
  BASE_CONTAINER_REGISTRY: docker.osdc.io/ncigdc
  NODE_VER: v24.14.0
  npm_config_https_proxy: http://cloud-proxy:3128
  npm_config_proxy: http://cloud-proxy:3128
  npm_config_registry: https://nexus.osdc.io/repository/npm-all/

image: docker.osdc.io/ncigdc/nodejs24:${NODEJS_BASE_CONTAINER_VERSION}

.default_rules: &default_rules
  rules:
    - if: '($CI_PIPELINE_SOURCE != "schedule" || $RUN_UI_TESTS_ONLY != "true") && $CI_COMMIT_TAG == null'

Linting:
  stage: test
  variables:
    NODE_ENV: test
    npm_config_tarball: /tmp/node-headers.tgz
  before_script:
    - curl -sSL https://nexus.osdc.io/repository/misc/nodejs/node-${NODE_VER}-headers.tar.gz -o /tmp/node-headers.tgz
    - dnf install gcc-c++ make -y
    - npm ci
  script:
    - npm run lint
  <<: *default_rules

Prettier Checks:
  stage: test
  variables:
    NODE_ENV: test
    npm_config_tarball: /tmp/node-headers.tgz
  before_script:
    - curl -sSL https://nexus.osdc.io/repository/misc/nodejs/node-${NODE_VER}-headers.tar.gz -o /tmp/node-headers.tgz
    - dnf install gcc-c++ make -y
    - npm ci
  script:
    - npm run format:check
  <<: *default_rules

Build and test core and portal:
  stage: test
  variables:
    NODE_ENV: test
    npm_config_tarball: /tmp/node-headers.tgz
  before_script:
    - curl -sSL https://nexus.osdc.io/repository/misc/nodejs/node-${NODE_VER}-headers.tar.gz -o /tmp/node-headers.tgz
    - dnf install gcc-c++ make -y
    - npm ci
  script:
    - npx lerna run clean
    - npx lerna run compile
    - npm run test:all
  <<: *default_rules

Build and push image:
  stage: release
  services:
    - docker:${DOCKER_VERSION}-dind
  tags:
    - dind
  image: docker:${DOCKER_VERSION}-dind
  before_script:
    - apk add bash
  script:
    - |
      docker build \
      --build-arg "NPM_REGISTRY=https://nexus.osdc.io/repository/npm-all/" \
      --build-arg "BUILD_SHORT_SHA=$CI_COMMIT_SHORT_SHA" \
      --build-arg BASE_CONTAINER_VERSION=$NODEJS_BASE_CONTAINER_VERSION \
      --build-arg BASE_CONTAINER_REGISTRY \
      --label org.opencontainers.image.created="$(date -Iseconds)" \
      --label org.opencontainers.image.revision="${CI_COMMIT_SHA}" \
      --label org.opencontainers.image.ref.name="${CI_PROJECT_NAME}:${CI_COMMIT_REF_NAME/\//_}" \
      -t $DOCKER_RELEASE_REGISTRY/ncigdc/$CI_PROJECT_NAME:$CI_COMMIT_REF_SLUG-${CI_COMMIT_SHORT_SHA} \
      -t $DOCKER_RELEASE_REGISTRY/ncigdc/$CI_PROJECT_NAME:$CI_COMMIT_SHA \
      --progress=plain .
    - docker push -a $DOCKER_RELEASE_REGISTRY/ncigdc/$CI_PROJECT_NAME
  <<: *default_rules

Push latest image:
  stage: "tag image"
  variables:
    GIT_STRATEGY: none
  services:
    - docker:${DOCKER_VERSION}-dind
  tags:
    - dind
  image: docker:${DOCKER_VERSION}-dind
  only:
    - master
  before_script:
    - apk add bash
  script:
    - docker pull $BASE_CONTAINER_REGISTRY/$CI_PROJECT_NAME:$CI_COMMIT_SHA
    - docker tag $BASE_CONTAINER_REGISTRY/$CI_PROJECT_NAME:$CI_COMMIT_SHA $DOCKER_RELEASE_REGISTRY/ncigdc/$CI_PROJECT_NAME:latest
    - docker push $DOCKER_RELEASE_REGISTRY/ncigdc/$CI_PROJECT_NAME:latest
  except:
    - schedules

Push tagged image:
  stage: "tag image"
  variables:
    GIT_STRATEGY: none
  services:
    - docker:${DOCKER_VERSION}-dind
  tags:
    - dind
  image: docker:${DOCKER_VERSION}-dind
  only:
    - tags
  before_script:
    - apk add bash
  script:
    - docker pull $BASE_CONTAINER_REGISTRY/$CI_PROJECT_NAME:$CI_COMMIT_SHA
    - docker tag $BASE_CONTAINER_REGISTRY/$CI_PROJECT_NAME:$CI_COMMIT_SHA $DOCKER_RELEASE_REGISTRY/ncigdc/$CI_PROJECT_NAME:${CI_COMMIT_TAG}
    - docker push $DOCKER_RELEASE_REGISTRY/ncigdc/$CI_PROJECT_NAME:${CI_COMMIT_TAG}

Build UI Tests Docker Image:
  stage: build_ui_tests_image
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RUN_UI_TESTS_ONLY == "true"'
      when: always
  services:
    - docker:${DOCKER_VERSION}-dind
  tags:
    - dind
  image: docker:${DOCKER_VERSION}-dind
  script:
    - docker build -t $DOCKER_RELEASE_REGISTRY/ncigdc/$CI_PROJECT_NAME-holmes-py:$CI_COMMIT_REF_SLUG-${CI_COMMIT_SHORT_SHA} -f ./holmes-py/Dockerfile ./holmes-py
    - docker push $DOCKER_RELEASE_REGISTRY/ncigdc/$CI_PROJECT_NAME-holmes-py:$CI_COMMIT_REF_SLUG-${CI_COMMIT_SHORT_SHA}

Trigger Holmes-py Tests:
  stage: trigger_ui_tests
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RUN_UI_TESTS_ONLY == "true"'
      when: always
  services:
    - docker:${DOCKER_VERSION}-dind
  tags:
    - dind
  image: docker:${DOCKER_VERSION}-dind
  script:
    - docker pull $DOCKER_RELEASE_REGISTRY/ncigdc/$CI_PROJECT_NAME-holmes-py:$CI_COMMIT_REF_SLUG-${CI_COMMIT_SHORT_SHA}
    - docker run -v $(pwd):/app --name holmes-py --add-host portal.gdc.cancer.gov:$PORTAL_REV_PROXY_IP_ADDRESS --env APP_ENVIRONMENT=PROD --env browser="headless chrome" -e PATH="$PATH:/usr/local/bin" -e no_proxy="portal.gdc.cancer.gov,localhost,127.0.0.1" "$DOCKER_RELEASE_REGISTRY/ncigdc/$CI_PROJECT_NAME-holmes-py:$CI_COMMIT_REF_SLUG-${CI_COMMIT_SHORT_SHA}" gauge run -p -n=6 ./holmes-py/specs/gdc_data_portal_v2/ --tags "$TAG_TEST_TYPE"
    - docker cp holmes-py:/app/holmes-py/.gauge holmes-py/.gauge || true
    - docker cp holmes-py:/app/holmes-py/downloads holmes-py/downloads || true
    - docker cp holmes-py:/app/holmes-py/logs holmes-py/logs || true
    - docker cp holmes-py:/app/holmes-py/reports holmes-py/reports || true
    - docker rm -f holmes-py || true
  artifacts:
    when: always
    paths:
      - holmes-py/.gauge
      - holmes-py/downloads
      - holmes-py/logs
      - holmes-py/reports*
    expire_in: 3 months

.deploy-service-with-salt:
  before_script:
    - export DEPLOY_SERVICE_TAG=${CI_COMMIT_TAG:-$DEPLOY_SERVICE_TAG}

.services:
  allow_failure: true
  stage: deploy
  when: manual
  parallel:
    matrix:
      - DEPLOY_SERVICE_LIST: [ portal2 ]
