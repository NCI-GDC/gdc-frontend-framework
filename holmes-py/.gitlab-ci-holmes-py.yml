stages:
  - run_ui_tests

run_ui_tests:
  stage: run_ui_tests
  services:
    - docker:${DOCKER_VERSION}-dind
  tags:
    - dind
  image: docker:${DOCKER_VERSION}-dind
  script:
  - echo '$PORTAL_REV_PROXY_IP_ADDRESS'
  - echo '$QA_INT_PORTAL_REV_PROXY_IP'
  - echo '$TESTER_VARIABLE_1'
  - echo '$TESTER_VARIABLE_2'
  - echo '${PORTAL_REV_PROXY_IP_ADDRESS}'
  - echo '${QA_INT_PORTAL_REV_PROXY_IP}'
  - echo '${TESTER_VARIABLE_1}'
  - echo '${TESTER_VARIABLE_2}'
  - echo ${PORTAL_REV_PROXY_IP_ADDRESS}
  - echo ${QA_INT_PORTAL_REV_PROXY_IP}
  - echo ${TESTER_VARIABLE_1}
  - echo ${TESTER_VARIABLE_2}

  - docker pull $DOCKER_RELEASE_REGISTRY/ncigdc/$CI_PROJECT_NAME-holmes-py:$CI_COMMIT_REF_SLUG-${CI_COMMIT_SHORT_SHA}
  - docker run -v $(pwd):/app --name holmes-py --add-host portal.gdc.cancer.gov:$PORTAL_REV_PROXY_IP_ADDRESS --env APP_ENVIRONMENT=QA_INT --env browser="headless firefox" -e PATH="$PATH:/usr/local/bin" -e no_proxy="portal.gdc.cancer.gov,localhost,127.0.0.1" "$DOCKER_RELEASE_REGISTRY/ncigdc/$CI_PROJECT_NAME-holmes-py:$CI_COMMIT_REF_SLUG-${CI_COMMIT_SHORT_SHA}" gauge run ./holmes-py/specs/gdc_data_portal_v2/header/link_checking.spec
  - docker cp holmes-py:/app/holmes-py/.gauge holmes-py/.gauge || true
  - docker cp holmes-py:/app/holmes-py/downloads holmes-py/downloads || true
  - docker cp holmes-py:/app/holmes-py/logs holmes-py/logs || true
  - docker cp holmes-py:/app/holmes-py/reports holmes-py/reports || true
  - docker rm -f holmes-py || true
  artifacts:
    when: always
    paths:
      - holmes-py/.gauge
      - holmes-py/downloads
      - holmes-py/logs
      - holmes-py/reports*
    expire_in: 3 months
